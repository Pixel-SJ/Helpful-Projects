<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel-SJ Grocery</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #fff7cc, #ffe0f0, #e0f7ff);
  background-size: 300% 300%;
  animation: bgMove 10s infinite alternate;
}

@keyframes bgMove {
  0% {background-position: left;}
  100% {background-position: right;}
}

/* LOADER */
#loader {
  position: fixed;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg,#ff6ec4,#7873f5);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  z-index: 999;
}

#logo {
  font-size: 40px;
  letter-spacing: 3px;
  animation: fadeIn 1.5s ease forwards;
}

#underline {
  width: 0;
  height: 3px;
  background: white;
  margin-top: 8px;
  animation: expand 1.5s ease forwards;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}

@keyframes expand {
  to {width: 160px;}
}

/* HEADER */
header {
  text-align: center;
  padding: 15px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  padding: 15px;
}

/* INPUT */
input {
  padding: 12px;
  border-radius: 12px;
  border: none;
  width: 65%;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

button {
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  cursor: pointer;
  color: #333;
  font-weight: bold;
}

/* CART */
.cart {
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  margin-top: 20px;
  padding: 15px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  position: relative;
}

.completed {
  opacity: 0.6;
}

/* 3 DOT MENU */
.menu {
  position: absolute;
  top: 10px;
  right: 10px;
  cursor: pointer;
}

.dropdown {
  display: none;
  position: absolute;
  right: 10px;
  top: 30px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.dropdown div {
  padding: 10px;
  cursor: pointer;
}

.dropdown div:hover {
  background: #eee;
}

/* ITEMS */
.item {
  display: flex;
  justify-content: space-between;
  background: rgba(255,255,255,0.7);
  margin: 5px 0;
  padding: 10px;
  border-radius: 10px;
}

.done {
  text-decoration: line-through;
  opacity: 0.5;
}

.delete {
  cursor: pointer;
  color: red;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <div id="logo">Pixel-SJ</div>
  <div id="underline"></div>
</div>

<header>🛒 Grocery Planner</header>

<div class="container">
  <input id="cartName" placeholder="New list name">
  <button onclick="addCart()">Add</button>
  <div id="carts"></div>
</div>

<script>
setTimeout(()=> {
  document.getElementById("loader").style.opacity="0";
  setTimeout(()=> document.getElementById("loader").style.display="none",500);
},2000);

let carts = JSON.parse(localStorage.getItem("groceryApp")) || [];

function save(){
  localStorage.setItem("groceryApp", JSON.stringify(carts));
}

function render(){
  const container = document.getElementById("carts");
  container.innerHTML = "";

  carts.forEach((cart,i)=>{

    let div = document.createElement("div");
    div.className = "cart " + (cart.completed ? "completed" : "");

    div.innerHTML = `
      <div class="menu" onclick="toggleMenu(${i})">⋮</div>
      <div id="menu-${i}" class="dropdown">
        <div onclick="deleteCart(${i})">Remove</div>
        <div onclick="copyCart(${i})">Copy</div>
        <div onclick="markCart(${i})">Mark Complete</div>
      </div>

      <h3>${cart.name}</h3>
      <small>Created: ${cart.created}</small>

      <br><br>
      <input id="item-${i}" placeholder="Add item">
      <button onclick="addItem(${i})">+</button>

      ${cart.items.map((item,j)=>`
        <div class="item ${item.done?'done':''}">
          <span onclick="toggleItem(${i},${j})">${item.text}</span>
          <span class="delete" onclick="deleteItem(${i},${j})">✖</span>
        </div>
      `).join("")}
    `;

    container.appendChild(div);
  });
}

function addCart(){
  let name = document.getElementById("cartName").value;
  if(!name) return;

  carts.push({
    name,
    created: new Date().toLocaleString(),
    items: [],
    completed:false
  });

  document.getElementById("cartName").value="";
  save(); render();
}

function deleteCart(i){
  carts.splice(i,1);
  save(); render();
}

function copyCart(i){
  let copy = JSON.parse(JSON.stringify(carts[i]));
  copy.name += " (copy)";
  carts.push(copy);
  save(); render();
}

function markCart(i){
  carts[i].completed = !carts[i].completed;
  save(); render();
}

function addItem(i){
  let input = document.getElementById(`item-${i}`);
  if(!input.value) return;

  carts[i].items.push({text:input.value, done:false});
  input.value="";
  save(); render();
}

function deleteItem(i,j){
  carts[i].items.splice(j,1);
  save(); render();
}

function toggleItem(i,j){
  carts[i].items[j].done = !carts[i].items[j].done;
  save(); render();
}

function toggleMenu(i){
  let m = document.getElementById(`menu-${i}`);
  m.style.display = m.style.display==="block"?"none":"block";
}

render();
</script>

</body>
</html>
